[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-config-dashboard"
dynamic = ["version"]
description = "Local web dashboard for your installed Claude Code configuration — plugins, agents, skills, commands, hooks, MCP servers, and rules, with usage analytics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AshtonYoon" }]
requires-python = ">=3.9"
keywords = ["claude", "claude-code", "dashboard", "config", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/AshtonYoon/claude-config-dashboard"
Repository = "https://github.com/AshtonYoon/claude-config-dashboard"
Changelog = "https://github.com/AshtonYoon/claude-config-dashboard/blob/main/CHANGELOG.md"

[project.scripts]
claude-config-dashboard = "claude_config_dashboard.server:main"

[tool.hatch.version]
path = "claude_config_dashboard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["claude_config_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["claude_config_dashboard"]
omit = ["claude_config_dashboard/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# inline HTML fragments read better unwrapped
"claude_config_dashboard/render.py" = ["E501"]
