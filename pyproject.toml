[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["claude_config_dashboard"]
omit = ["claude_config_dashboard/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# inline HTML fragments read better unwrapped
"claude_config_dashboard/render.py" = ["E501"]
